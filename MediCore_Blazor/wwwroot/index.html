<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediCore_Blazor</title>
    <base href="/" />
    <link href="css/index.css" rel="stylesheet" />
    <link href="css/nav_menu.css" rel="stylesheet" />
    <link href="MediCore_Blazor.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app"></div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
                    window.themeManager = {
                        init: function () {
                            const saved = localStorage.getItem('medicore-theme');
                            if (saved) {
                                document.documentElement.setAttribute('data-theme', saved);
                                return saved;
                            }
                            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                            const theme = prefersDark ? 'dark' : 'light';
                            document.documentElement.setAttribute('data-theme', theme);
                            return theme;
                        },
                        toggle: function () {
                            const current = document.documentElement.getAttribute('data-theme') || 'light';
                            const next = current === 'dark' ? 'light' : 'dark';
                            document.documentElement.setAttribute('data-theme', next);
                            localStorage.setItem('medicore-theme', next);
                            return next;
                        }
                    };
                    window.themeManager.init();
    </script>
</body>

</html>
